version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: recyconnect-db
    restart: always
    environment:
      POSTGRES_DB: recyconnect
      POSTGRES_USER: recyconnect_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port non publie: la base n'est joignable que depuis le reseau Docker.
    # Decommenter uniquement pour un acces local de debug.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recyconnect_user -d recyconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Spring Boot
  app:
    build: .
    container_name: recyconnect-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/recyconnect
      SPRING_DATASOURCE_USERNAME: recyconnect_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis}
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # Server
      SERVER_PORT: 8081
      # File uploads
      FILE_UPLOAD_DIR: /app/uploads
      # Securite (requis, aucune valeur par defaut)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1380}
      # SMS
      SMS_VALIDATION_KEY: ${SMS_VALIDATION_KEY:?SMS_VALIDATION_KEY est requis}
      SMS_TOKEN: ${SMS_TOKEN:?SMS_TOKEN est requis}
      # URLs publiques
      APP_CLIENT_URL: ${APP_CLIENT_URL:?APP_CLIENT_URL est requis}
      APP_SERVER_URL: ${APP_SERVER_URL:?APP_SERVER_URL est requis}
      # Administrateur d'amorcage (voir Config/AdminSeeder.java).
      # Desactive par defaut en prod: n'activer que le temps de creer le
      # premier ADMIN, puis remettre ADMIN_SEED_ENABLED=false et changer
      # le mot de passe. Le seeder ne touche jamais un compte existant.
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_PHONE: ${ADMIN_SEED_PHONE:-22222222}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      # Catalogue des categories (voir Config/CategorySeeder.java).
      # Donnee de reference, pas de demonstration: sans elle, l'application
      # mobile n'a aucune categorie a proposer.
      CATEGORY_SEED_ENABLED: ${CATEGORY_SEED_ENABLED:-true}
      # Jeu de donnees de demonstration (voir Config/DemoSeeder.java).
      # Quatre comptes, dix annonces situees dans Nouakchott et leurs offres:
      # n'activer que sur un environnement de demonstration, jamais sur celui
      # des vrais utilisateurs.
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
      # Firebase Cloud Messaging: la cle est montee en volume (voir ci-dessous),
      # jamais embarquee dans l'image. Le prefixe "file:" est obligatoire.
      FCM_SERVICE_ACCOUNT_KEY: file:/app/secrets/service-account-key.json
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-recyconnect-24ffd}
      # Politique de version de l'application mobile (voir
      # Service/AppVersionService.java). APP_VERSION_MINIMUM bloque les
      # installations plus anciennes derriere un ecran de mise a jour: ne jamais
      # y placer une version absente du magasin.
      APP_VERSION_LATEST: ${APP_VERSION_LATEST:-}
      APP_VERSION_MINIMUM: ${APP_VERSION_MINIMUM:-}
      APP_VERSION_ANDROID_URL: ${APP_VERSION_ANDROID_URL:-https://play.google.com/store/apps/details?id=com.recyconnect.app.neyan}
      APP_VERSION_IOS_URL: ${APP_VERSION_IOS_URL:-}
    volumes:
      - uploads_data:/app/uploads
      # Cle de service Firebase, en lecture seule. Placer le fichier a cet emplacement
      # sur l'hote (ou surcharger FCM_SERVICE_ACCOUNT_KEY_FILE dans .env).
      # Attention: si le fichier hote n'existe pas, Docker cree un repertoire vide a sa
      # place. L'application demarre quand meme, en journalisant "FCM desactive".
      - ${FCM_SERVICE_ACCOUNT_KEY_FILE:-./secrets/service-account-key.json}:/app/secrets/service-account-key.json:ro
    ports:
      - "8081:8081"

volumes:
  postgres_data:
  uploads_data:
