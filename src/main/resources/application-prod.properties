# Production Profile
spring.application.name=RecyConnect

# Server
server.port=${SERVER_PORT:8081}

# Database - from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Production settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Pas de session Hibernate ouverte pendant le rendu de la reponse: les controleurs
# ne renvoient que des DTO, aucune association lazy n'est touchee hors transaction.
spring.jpa.open-in-view=false

# Securite JWT (obligatoire, aucune valeur par defaut)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1380}
# Duree de vie du jeton de rafraichissement, en jours (point H4 de l'audit
# mobile). Long par construction: c'est ce qui evite de redemander le mot de
# passe. La revocation ne repose pas sur cette duree mais sur la session —
# deconnexion, connexion ailleurs ou reinitialisation du mot de passe
# l'invalident immediatement.
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# SMS Chinguisoft
sms.chinguisoft.validation-key=${SMS_VALIDATION_KEY}
sms.chinguisoft.token=${SMS_TOKEN}
sms.chinguisoft.base-url=${SMS_BASE_URL:https://chinguisoft.com/api/sms/validation}
sms.chinguisoft.lang=${SMS_LANG:fr}

# Compte administrateur d'amorcage
# Desactive par defaut: un administrateur au mot de passe connu ne doit jamais
# apparaitre tout seul sur un environnement expose. Activer ponctuellement pour
# amorcer une base neuve, avec un mot de passe fourni par l'environnement.
app.admin-seed.enabled=${ADMIN_SEED_ENABLED:false}
app.admin-seed.username=${ADMIN_SEED_USERNAME:admin}
app.admin-seed.phone=${ADMIN_SEED_PHONE:22222222}
app.admin-seed.password=${ADMIN_SEED_PASSWORD:}

# Catalogue des categories (donnee de reference, cf. CategorySeeder)
# Actif meme en production: sans categories, l'application mobile est inutilisable.
app.category-seed.enabled=${CATEGORY_SEED_ENABLED:true}

# Jeu de donnees de demonstration (cf. DemoSeeder)
# Desactive: des annonces fictives ne doivent jamais apparaitre sur un
# environnement ouvert au public. Activer ponctuellement pour une demonstration,
# avec un mot de passe fourni par l'environnement.
app.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
app.demo-seed.password=${DEMO_SEED_PASSWORD:}

# File uploads
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS - liste blanche d'origines autorisees, separees par des virgules.
# Ne jamais utiliser "*" : cela autorise n'importe quel site a appeler l'API.
app.client.url=${APP_CLIENT_URL}
app.server.url=${APP_SERVER_URL}

# Firebase Cloud Messaging (FCM)
# La cle de service est un secret: elle n'est jamais embarquee dans l'image Docker,
# mais montee en lecture seule dans le conteneur (voir docker-compose.yml).
# Le prefixe "file:" est obligatoire pour lire hors du classpath.
fcm.service-account-key=${FCM_SERVICE_ACCOUNT_KEY:file:/app/secrets/service-account-key.json}
fcm.project-id=${FCM_PROJECT_ID:recyconnect-24ffd}

# --- Politique de version de l'application mobile ---
# Servie par GET /api/app/version, lue par le mobile a chaque demarrage.
#   app.version.minimum : en deca, l'application affiche un ecran bloquant dont
#                         on ne sort qu'en mettant a jour.
#   app.version.latest  : au-dessus, une mise a jour facultative est proposee.
#
# Vides par defaut, et c'est deliberé: ces deux lignes sont les seules de toute
# la configuration capables de rendre l'application inutilisable pour tout le
# parc installe. Bloquer un parc doit etre un acte explicite d'exploitation, pas
# l'effet de bord d'un deploiement. Tant qu'elles sont vides, le mobile ne
# verifie rien et se comporte comme avant.
#
# Ne jamais renseigner un minimum superieur a ce qui est REELLEMENT publie sur
# le magasin: l'utilisateur serait enferme devant un bouton sans effet. Le
# service ramene d'office un minimum trop haut a app.version.latest et omet
# toute valeur illisible plutot que de la transmettre (voir AppVersionService).
app.version.latest=${APP_VERSION_LATEST:}
app.version.minimum=${APP_VERSION_MINIMUM:}
app.version.android-url=${APP_VERSION_ANDROID_URL:https://play.google.com/store/apps/details?id=com.recyconnect.app.neyan}
app.version.ios-url=${APP_VERSION_IOS_URL:}
