# Production Profile
spring.application.name=RecyConnect

# Server
server.port=${SERVER_PORT:8081}

# Database - from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Production settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Securite JWT (obligatoire, aucune valeur par defaut)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1380}

# SMS Chinguisoft
sms.chinguisoft.validation-key=${SMS_VALIDATION_KEY}
sms.chinguisoft.token=${SMS_TOKEN}
sms.chinguisoft.base-url=${SMS_BASE_URL:https://chinguisoft.com/api/sms/validation}
sms.chinguisoft.lang=${SMS_LANG:fr}

# File uploads
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS - liste blanche d'origines autorisees, separees par des virgules.
# Ne jamais utiliser "*" : cela autorise n'importe quel site a appeler l'API.
app.client.url=${APP_CLIENT_URL}
app.server.url=${APP_SERVER_URL}

# Firebase Cloud Messaging (FCM)
fcm.service-account-key=service-account-key.json
fcm.project-id=recyconnect-24ffd
