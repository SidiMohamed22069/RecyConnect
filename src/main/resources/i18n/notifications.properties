# Libelles des notifications — fichier de base, en francais.
#
# Il n'existe volontairement PAS de notifications_fr.properties: ce fichier-ci
# est a la fois la version francaise et le recours de toutes les autres. Une
# cle oubliee dans notifications_ar.properties tombe donc en francais au lieu
# de faire echouer l'envoi, et le francais ne peut pas diverger de lui-meme.
#
# Encodage UTF-8 (impose par NotificationMessagesConfig).
#
# Les textes passent par java.text.MessageFormat des qu'un argument est fourni:
# l'apostrophe droite ' y est un caractere de citation et masquerait le texte
# qui suit. On utilise donc l'apostrophe typographique ’, que MessageFormat
# laisse intacte.

# --- Offres ---
notification.OFFER_RECEIVED.title=Nouvelle offre reçue
notification.OFFER_RECEIVED.body={0} vous a fait une offre pour : {1}

notification.OFFER_ACCEPTED.title=Offre acceptée
notification.OFFER_ACCEPTED.body=Votre offre sur {0} a été acceptée

notification.OFFER_REJECTED.title=Offre rejetée
notification.OFFER_REJECTED.body=Votre offre sur {0} a été rejetée

notification.OFFER_REFUSED.title=Offre refusée
notification.OFFER_REFUSED.body={0} a refusé votre offre pour : {1}

notification.OFFER_UPDATED.title=Offre modifiée
notification.OFFER_UPDATED.body={0} a modifié une offre sur {1}

notification.OFFER_CANCELLED.title=Offre annulée
notification.OFFER_CANCELLED.body={0} a annulé son offre sur {1}

notification.OFFER_AUTO_CANCELLED_STOCK.title=Offre annulée automatiquement
notification.OFFER_AUTO_CANCELLED_STOCK.body=Votre offre sur {0} dépasse la quantité restante

notification.OUTBID_BY_BETTER_OFFER.title=Offre plus rentable détectée
notification.OUTBID_BY_BETTER_OFFER.body=Une offre plus rentable que la vôtre est en tête de file pour {0}

notification.QUEUE_UPDATED.title=File des offres mise à jour
notification.QUEUE_UPDATED.body=La file des offres a été mise à jour pour {0}

# --- Types prevus, sans appelant aujourd'hui ---
# Le backend ne comporte ni validation d’annonce par un administrateur, ni
# messagerie. Les libelles sont ecrits d’avance pour que le jour ou ces flux
# arrivent, seul l’appel a NotificationService reste a ecrire.
notification.PRODUCT_APPROVED.title=Annonce validée
notification.PRODUCT_APPROVED.body=Votre annonce {0} a été validée par l’administrateur

notification.NEW_MESSAGE.title=Nouveau message
notification.NEW_MESSAGE.body={0} vous a envoyé un message

# --- Diagnostic ---
notification.TEST.title=Test FCM RecyConnect
notification.TEST.body=Si vous voyez cette notification, FCM fonctionne correctement.

# --- Remplacements ---
# Servent quand la donnee attendue manque, pour ne jamais afficher "null".
notification.fallback.sender=Un utilisateur
notification.fallback.value=un élément
