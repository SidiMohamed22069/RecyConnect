# Libelles des notifications en anglais.
#
# Toute cle absente ici retombe sur notifications.properties, c'est-a-dire sur
# le francais: une traduction manquante degrade l'experience sans casser
# l'envoi.
#
# Encodage UTF-8 (impose par NotificationMessagesConfig).
#
# L'apostrophe droite ' est un caractere de citation pour MessageFormat: on
# utilise l'apostrophe typographique ’ dans les textes anglais.

# --- Offres ---
notification.OFFER_RECEIVED.title=New offer received
notification.OFFER_RECEIVED.body={0} made an offer on: {1}

notification.OFFER_ACCEPTED.title=Offer accepted
notification.OFFER_ACCEPTED.body=Your offer on {0} was accepted

notification.OFFER_REJECTED.title=Offer rejected
notification.OFFER_REJECTED.body=Your offer on {0} was rejected

notification.OFFER_REFUSED.title=Offer declined
notification.OFFER_REFUSED.body={0} declined your offer on: {1}

notification.OFFER_UPDATED.title=Offer updated
notification.OFFER_UPDATED.body={0} updated an offer on {1}

notification.OFFER_CANCELLED.title=Offer cancelled
notification.OFFER_CANCELLED.body={0} cancelled their offer on {1}

notification.OFFER_AUTO_CANCELLED_STOCK.title=Offer cancelled automatically
notification.OFFER_AUTO_CANCELLED_STOCK.body=Your offer on {0} exceeds the remaining quantity

notification.OUTBID_BY_BETTER_OFFER.title=A better offer was placed
notification.OUTBID_BY_BETTER_OFFER.body=An offer better than yours now leads the queue for {0}

notification.QUEUE_UPDATED.title=Offer queue updated
notification.QUEUE_UPDATED.body=The offer queue was updated for {0}

# --- Types prevus, sans appelant aujourd'hui ---
notification.PRODUCT_APPROVED.title=Listing approved
notification.PRODUCT_APPROVED.body=Your listing {0} was approved by the administrator

notification.NEW_MESSAGE.title=New message
notification.NEW_MESSAGE.body={0} sent you a message

# --- Diagnostic ---
notification.TEST.title=RecyConnect FCM test
notification.TEST.body=If you can read this notification, FCM works correctly.

# --- Remplacements ---
notification.fallback.sender=A user
notification.fallback.value=an item
