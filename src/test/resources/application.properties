# Configuration de test.
# Les tests ne doivent dependre ni d'une base PostgreSQL installee,
# ni de secrets reels: tout est fourni ici en dur, sans valeur sensible.

spring.application.name=RecyConnect-test

# --- Base en memoire ---
spring.datasource.url=jdbc:h2:mem:recyconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Aligne sur les profils dev et prod.
spring.jpa.open-in-view=false
# Le dialecte est detecte automatiquement par Hibernate 6.

# --- Secret JWT factice, valide uniquement pour les tests ---
jwt.secret=secret-de-test-uniquement-32-octets-minimum-pour-hs256
jwt.expiration-minutes=60

# --- Seed admin desactive: les tests ne doivent pas dependre d'un compte cree au demarrage ---
app.admin-seed.enabled=false

# --- Valeurs neutres pour les integrations externes ---
sms.chinguisoft.validation-key=test
sms.chinguisoft.token=test
sms.chinguisoft.base-url=http://localhost:0/sms
sms.chinguisoft.lang=fr

app.client.url=http://localhost:4200
app.server.url=http://localhost

file.upload-dir=target/test-uploads

# Firebase desactive: aucune cle fournie, FCMService demarre sans initialiser.
fcm.service-account-key=
fcm.project-id=
